worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Increase limits for file uploads / presigned MinIO payloads
    client_max_body_size 50m;

    upstream flask_app {
        server app:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # MinIO media proxy — /media/<bucket>/<key> → http://minio:9000/<bucket>/<key>
        location /media/ {
            proxy_pass         http://minio:9000/;
            proxy_http_version 1.1;
            proxy_set_header   Host              minio:9000;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_hide_header  x-amz-request-id;
            proxy_hide_header  x-amz-id-2;
            proxy_cache_bypass $http_upgrade;
        }

        # Forward all requests to the Flask application
        location / {
            proxy_pass         http://flask_app;
            proxy_http_version 1.1;

            # Standard proxy headers so Flask sees the real client IP & protocol
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket upgrade support (useful for future live-reload or runtime streams)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            # Disable buffering so streamed responses arrive immediately
            proxy_buffering    off;
        }
    }
}
