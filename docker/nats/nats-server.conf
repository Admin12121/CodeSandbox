# NATS auth config for CodeSandbox. Two credentials, matching how the code
# actually splits duties:
#
#  - control_plane: the Flask/Starlette app (codesandbox/asgi.py). It is both
#    the terminal/filesystem dispatcher *and* the browser-facing gateway (the
#    browser only ever talks to it over its own websocket/token gateway, never
#    to NATS directly), so it needs one identity, not two.
#  - worker: every worker process shares this one credential. Per-worker
#    isolation comes from the worker_id segment baked into the subject itself
#    (codesandbox.worker.<worker_id>.>) plus each worker only subscribing to
#    its own worker_id's subjects — not from separate NATS credentials per
#    worker, since a static config file (below) can't parameterize permissions
#    by a client-supplied connection value.
#
# $NATS_CONTROL_PLANE_USER / $NATS_CONTROL_PLANE_PASSWORD and
# $NATS_WORKER_USER / $NATS_WORKER_PASSWORD are read from the environment by
# nats-server's built-in config variable substitution — see docker-compose.yml
# and docs/runtime-architecture.md for how they're set in dev vs production.

port: 4222

authorization {
  users = [
    {
      user: $NATS_CONTROL_PLANE_USER
      password: $NATS_CONTROL_PLANE_PASSWORD
      permissions: {
        publish: ["codesandbox.worker.>"]
        # _INBOX.> is the reply subject nats.py auto-subscribes to for
        # request/reply (used by the filesystem API's nc.request(...) calls)
        # — without it, request() times out even though the worker replies.
        subscribe: ["codesandbox.sandbox.>", "_INBOX.>"]
      }
    }
    {
      user: $NATS_WORKER_USER
      password: $NATS_WORKER_PASSWORD
      permissions: {
        # Workers publish sandbox events/metrics/logs plus fs request replies
        # (which land on the control-plane's _INBOX.* reply subject).
        publish: ["codesandbox.sandbox.>", "_INBOX.>"]
        subscribe: ["codesandbox.worker.>"]
      }
    }
  ]
}
