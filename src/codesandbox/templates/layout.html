<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ meta.title if meta is defined and meta.title is defined else "CodeSandbox" }}</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <style>
      @font-face {
        font-family: "AtAero";
        src: url("/fonts/AtAero-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "cooperLtBT";
        src: url("/fonts/CooperLightBT.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      
      html,
      body {
        font-family: "AtAero", ui-sans-serif, system-ui, sans-serif;
      }
    </style>
    {% if use_built_tailwind %}
      <link rel="stylesheet" href="/app.css" />
    {% else %}
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      <style type="text/tailwindcss">
        {% include "style.css" %}
      </style>
    {% endif %}
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased overflow-x-hidden">
    {% include "components/csrf-fetch.html" %}
    {{ children|safe }}
  </body>
</html>
