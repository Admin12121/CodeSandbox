{% import "components/ui/resizable.html" as resizable %}

{% macro lab_editor() -%}
{% call resizable.resizable_panel(default_size=70, min_size=20, class="hidden", attrs={"data-panel": "editor"}) %}
  <div class="flex h-8 shrink-0 items-center justify-between border-b bg-background">
    <div class="flex h-full items-center">
      <button class="flex h-full w-8 items-center justify-center border-r text-muted-foreground hover:bg-accent hover:text-accent-foreground">←</button>
      <button class="flex h-full w-8 items-center justify-center border-r text-muted-foreground hover:bg-accent hover:text-accent-foreground">→</button>

      <div data-editor-tabs class="flex h-full items-center"></div>
    </div>
  </div>

  <div class="flex h-8 shrink-0 items-center justify-between border-b px-3 text-xs text-muted-foreground">
    <span id="current-file-title"></span>
  </div>

  <div data-editor-panes class="min-h-0 flex-1 overflow-auto bg-background font-mono text-xs"></div>
{% endcall %}
{%- endmacro %}
