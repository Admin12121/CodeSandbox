{% macro progress(value=0, class="", attrs={}) -%}
  <div class="{{ cn('h-2 w-full overflow-hidden rounded-full bg-neutral-100', class) }}" data-slot="progress" role="progressbar" aria-valuenow="{{ value }}" aria-valuemin="0" aria-valuemax="100" {{ html_attrs(**attrs) }}><div class="h-full bg-neutral-900 transition-all" style="width: {{ value }}%"></div></div>
{%- endmacro %}
