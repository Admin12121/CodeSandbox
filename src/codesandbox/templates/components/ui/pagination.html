{% macro pagination(page=1, pages=1, class="", attrs={}) -%}
  <nav class="{{ cn('flex items-center gap-1', class) }}" data-slot="pagination" {{ html_attrs(**attrs) }}>{% for n in range(1, pages + 1) %}<a class="{{ cn('inline-flex size-8 items-center justify-center rounded-md text-sm', 'bg-neutral-900 text-white' if n == page else 'hover:bg-neutral-100') }}" href="?page={{ n }}">{{ n }}</a>{% endfor %}</nav>
{%- endmacro %}
