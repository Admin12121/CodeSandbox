{% macro menu(class="", attrs={}) -%}
  <div class="{{ cn('min-w-40 rounded-lg border border-neutral-200 bg-white p-1 shadow-lg', class) }}" data-slot="menu" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% endif %}</div>
{%- endmacro %}

{% macro menu_item(href="", class="", attrs={}) -%}
  {% if href %}<a class="{{ cn('block rounded-md px-2 py-1.5 text-sm hover:bg-neutral-100', class) }}" data-slot="menu-item" href="{{ href }}" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% endif %}</a>{% else %}<button class="{{ cn('block w-full rounded-md px-2 py-1.5 text-left text-sm hover:bg-neutral-100', class) }}" data-slot="menu-item" type="button" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% endif %}</button>{% endif %}
{%- endmacro %}
