{% macro avatar(src="", alt="", fallback="", class="", attrs={}) -%}
  <span class="{{ cn('inline-flex size-10 shrink-0 items-center justify-center overflow-hidden rounded-full bg-neutral-100 text-sm font-medium text-neutral-700', class) }}" data-slot="avatar" {{ html_attrs(**attrs) }}>{% if src %}<img class="size-full object-cover" src="{{ src }}" alt="{{ alt }}">{% else %}{{ fallback or alt[:2] }}{% endif %}</span>
{%- endmacro %}
