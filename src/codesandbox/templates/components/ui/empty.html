{% macro empty(title="No results", description="", class="", attrs={}) -%}
  <div class="{{ cn('flex min-h-48 flex-col items-center justify-center rounded-xl border border-dashed border-neutral-300 p-8 text-center', class) }}" data-slot="empty" {{ html_attrs(**attrs) }}><h3 class="font-medium">{{ title }}</h3>{% if description %}<p class="mt-1 text-sm text-neutral-500">{{ description }}</p>{% endif %}{% if caller is defined %}<div class="mt-4">{{ caller() }}</div>{% endif %}</div>
{%- endmacro %}
