{% macro radio_group(name="", options=[], value="", class="", attrs={}) -%}
  <div class="{{ cn('grid gap-2', class) }}" data-slot="radio-group" {{ html_attrs(**attrs) }}>{% for option in options %}<label class="flex items-center gap-2 text-sm"><input class="size-4" type="radio" name="{{ name }}" value="{{ option.value or option }}" {% if value == (option.value or option) %}checked{% endif %}>{{ option.label or option }}</label>{% endfor %}{% if caller is defined %}{{ caller() }}{% endif %}</div>
{%- endmacro %}
