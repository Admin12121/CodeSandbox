{% macro radio_group(name="", class="", attrs={}) -%}<div class="{{ cn('grid gap-2', class) }}" data-slot="radio-group" role="radiogroup" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% endif %}</div>{%- endmacro %}
{% macro radio(name="", value="", checked=false, disabled=false, class="", attrs={}) -%}<input class="{{ cn('size-4 rounded-full border border-input text-primary focus:ring-2 focus:ring-ring disabled:cursor-not-allowed disabled:opacity-50', class) }}" data-slot="radio" type="radio" {% if name %}name="{{ name }}"{% endif %} value="{{ value }}" {% if checked %}checked{% endif %} {% if disabled %}disabled{% endif %} {{ html_attrs(**attrs) }}>{%- endmacro %}
