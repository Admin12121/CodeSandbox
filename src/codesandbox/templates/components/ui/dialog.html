{% macro dialog(open=false, class="", attrs={}) -%}
  <dialog class="{{ cn('rounded-xl border border-neutral-200 bg-white p-0 shadow-xl backdrop:bg-black/40', class) }}" data-slot="dialog" {% if open %}open{% endif %} {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% endif %}</dialog>
{%- endmacro %}

{% macro dialog_content(class="", attrs={}) -%}
  <div class="{{ cn('grid gap-4 p-6', class) }}" data-slot="dialog-content" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% endif %}</div>
{%- endmacro %}
