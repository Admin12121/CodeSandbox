{% macro select(name="", options=[], value="", class="", attrs={}) -%}
  <select class="{{ cn('h-9 w-full rounded-lg border border-neutral-200 bg-white px-3 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-neutral-400', class) }}" data-slot="select" {% if name %}name="{{ name }}"{% endif %} {{ html_attrs(**attrs) }}>{% for option in options %}<option value="{{ option.value or option }}" {% if value == (option.value or option) %}selected{% endif %}>{{ option.label or option }}</option>{% endfor %}</select>
{%- endmacro %}
