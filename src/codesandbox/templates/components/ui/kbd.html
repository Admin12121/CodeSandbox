{% macro kbd(text="", class="", attrs={}) -%}
  <kbd class="{{ cn('inline-flex h-5 min-w-5 items-center justify-center rounded border border-neutral-200 bg-neutral-50 px-1 font-mono text-xs text-neutral-700 shadow-sm', class) }}" data-slot="kbd" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% else %}{{ text }}{% endif %}</kbd>
{%- endmacro %}
