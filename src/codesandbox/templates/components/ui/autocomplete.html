{% macro autocomplete(name="", options=[], placeholder="Search...", class="", attrs={}) -%}
  <div class="{{ cn('grid gap-2', class) }}" data-slot="autocomplete" {{ html_attrs(**attrs) }}><input class="h-9 rounded-lg border border-neutral-200 bg-white px-3 text-sm shadow-sm outline-none focus:ring-2 focus:ring-neutral-400" list="{{ name }}-options" name="{{ name }}" placeholder="{{ placeholder }}"><datalist id="{{ name }}-options">{% for option in options %}<option value="{{ option.value or option }}">{{ option.label or option }}</option>{% endfor %}</datalist></div>
{%- endmacro %}
