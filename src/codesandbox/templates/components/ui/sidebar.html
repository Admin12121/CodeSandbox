{% macro sidebar(class="", attrs={}) -%}
  <aside class="{{ cn('flex min-h-screen w-64 flex-col border-r border-neutral-200 bg-white p-4', class) }}" data-slot="sidebar" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% endif %}</aside>
{%- endmacro %}

{% macro sidebar_item(href="#", active=false, class="", attrs={}) -%}
  <a class="{{ cn('rounded-md px-3 py-2 text-sm hover:bg-neutral-100', 'bg-neutral-100 font-medium text-neutral-900' if active else 'text-neutral-600', class) }}" data-slot="sidebar-item" href="{{ href }}" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% endif %}</a>
{%- endmacro %}
