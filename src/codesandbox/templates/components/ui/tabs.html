{% macro tabs(class="", attrs={}) -%}
  <div class="{{ cn('grid gap-3', class) }}" data-slot="tabs" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% endif %}</div>
{%- endmacro %}

{% macro tab_list(class="", attrs={}) -%}
  <div class="{{ cn('inline-flex rounded-lg bg-neutral-100 p-1', class) }}" data-slot="tab-list" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% endif %}</div>
{%- endmacro %}

{% macro tab(text="", active=false, class="", attrs={}) -%}
  <button class="{{ cn('rounded-md px-3 py-1.5 text-sm font-medium', 'bg-white shadow-sm' if active else 'text-neutral-500 hover:text-neutral-900', class) }}" data-slot="tab" type="button" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% else %}{{ text }}{% endif %}</button>
{%- endmacro %}
