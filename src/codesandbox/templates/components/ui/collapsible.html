{% macro collapsible(title="", open=false, class="", attrs={}) -%}
  <details class="{{ cn('rounded-lg border border-neutral-200 bg-white p-4', class) }}" data-slot="collapsible" {% if open %}open{% endif %} {{ html_attrs(**attrs) }}><summary class="cursor-pointer font-medium">{{ title }}</summary><div class="mt-3 text-sm text-neutral-600">{% if caller is defined %}{{ caller() }}{% endif %}</div></details>
{%- endmacro %}
