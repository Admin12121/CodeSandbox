{% macro accordion(class="", attrs={}) -%}
  <div class="{{ cn('divide-y divide-neutral-200 rounded-lg border border-neutral-200 bg-white', class) }}" data-slot="accordion" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% endif %}</div>
{%- endmacro %}

{% macro accordion_item(title="", open=false, class="", attrs={}) -%}
  <details class="{{ cn('group p-4', class) }}" data-slot="accordion-item" {% if open %}open{% endif %} {{ html_attrs(**attrs) }}><summary class="cursor-pointer list-none font-medium">{{ title }}</summary><div class="mt-2 text-sm text-neutral-500">{% if caller is defined %}{{ caller() }}{% endif %}</div></details>
{%- endmacro %}
