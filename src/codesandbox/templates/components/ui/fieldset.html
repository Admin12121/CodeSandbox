{% macro fieldset(legend="", class="", attrs={}) -%}
  <fieldset class="{{ cn('grid gap-4 rounded-xl border border-neutral-200 p-4', class) }}" data-slot="fieldset" {{ html_attrs(**attrs) }}>{% if legend %}<legend class="px-1 text-sm font-medium">{{ legend }}</legend>{% endif %}{% if caller is defined %}{{ caller() }}{% endif %}</fieldset>
{%- endmacro %}
