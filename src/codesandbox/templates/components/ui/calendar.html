{% macro calendar(class="", attrs={}) -%}
  <div class="{{ cn('rounded-xl border border-neutral-200 bg-white p-4 shadow-sm', class) }}" data-slot="calendar" {{ html_attrs(**attrs) }}>{% if caller is defined %}{{ caller() }}{% else %}<input class="h-9 rounded-lg border border-neutral-200 px-3 text-sm" type="date">{% endif %}</div>
{%- endmacro %}
