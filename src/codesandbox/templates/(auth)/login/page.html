{% import "(auth)/login/_components/form.html" as login %}
{% import "components/ui/field.html" as field %}

<div class="flex min-h-screen flex-col bg-stone-50 dark:bg-stone-950">
  <header class="w-full">
    <div class="mx-auto flex h-14 w-full max-w-6xl items-center px-4 lg:px-6">
      <a aria-label="Go to home" class="flex w-fit items-center gap-2.5 py-2 hover:opacity-70" href="/">
        <img src="/logo.webp" alt="" class="size-10 object-contain">
        <span class="text-base font-semibold tracking-tight text-stone-800 dark:text-stone-100">CodeSandbox</span>
      </a>
    </div>
  </header>
  <main class="grid flex-1 place-items-center px-6 py-10">
    <section class="w-full max-w-sm">
      {% if info %}
        <div class="mb-4 rounded-lg border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-sm text-emerald-700 dark:text-emerald-400">{{ info }}</div>
      {% endif %}
      {{ login.login_form(mode=mode, error=error, next_path=next_path) }}
    </section>
  </main>
</div>
