<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>CodeSandbox</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#f4f4f5;padding:40px 16px">
  <tr><td align="center">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:560px;width:100%;background:#ffffff;border-radius:14px;border:1px solid #e4e4e7;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)">

      {# ── Header ── #}
      <tr>
        <td style="padding:22px 36px;border-bottom:1px solid #f4f4f5">
          <table cellpadding="0" cellspacing="0" role="presentation">
            <tr>
              <td style="background:#18181b;border-radius:8px;width:34px;height:34px;text-align:center;vertical-align:middle">
                <span style="color:#ffffff;font-weight:800;font-size:12px;line-height:34px;letter-spacing:.05em">CS</span>
              </td>
              <td style="padding-left:10px;vertical-align:middle">
                <span style="font-weight:700;font-size:15px;color:#18181b;letter-spacing:-.01em">CodeSandbox</span>
              </td>
            </tr>
          </table>
        </td>
      </tr>

      {# ── Body ── #}
      <tr>
        <td style="padding:36px 36px 32px">
          {% block content %}{% endblock %}
        </td>
      </tr>

      {# ── Footer ── #}
      <tr>
        <td style="padding:16px 36px 24px;border-top:1px solid #f4f4f5;text-align:center">
          <p style="margin:0 0 6px;font-size:12px;color:#a1a1aa;line-height:1.5">
            You received this because an action was performed on your CodeSandbox account.
          </p>
          <p style="margin:0;font-size:12px;color:#a1a1aa;line-height:1.5">
            © {{ now.year if now is defined else "2025" }} CodeSandbox. All rights reserved.
          </p>
        </td>
      </tr>

    </table>
  </td></tr>
</table>
</body>
</html>
