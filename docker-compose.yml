services:

  # ── Reverse proxy ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: codesandbox-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # ── Flask application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      network: host
    container_name: codesandbox-app
    command:
      - /bin/sh
      - -c
      - |
        # `makemigrations` is a manual, human-reviewed dev step (see
        # docs/runtime-architecture.md) — it must never run automatically
        # at container start, in dev or prod. Only apply already-committed,
        # reviewed migrations here.
        uv run nexorm migrate
        uv run python seed.py
        exec uv run uvicorn codesandbox.asgi:app --host 0.0.0.0 --port 5000 --reload
    volumes:
      - .:/app
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/codesandbox/.venv
      # The image already has a complete venv (Dockerfile.dev installs the
      # full project, not just deps, at build time with real network
      # access). Without this, `uv run`'s startup sync check treats the
      # bind-mounted src/ (a different inode/mtime set than what was in the
      # build context) as reason to reinstall the editable local packages —
      # which then needs network the running container doesn't have. This
      # makes uv trust the image's venv as-is; re-run `docker compose build
      # app` after any pyproject.toml/uv.lock change instead.
      UV_NO_SYNC: "1"
      DATABASE_URL: mysql://codesandbox:codesandbox@mysql:3306/codesandbox
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: codesandbox
      S3_ARTIFACT_BUCKET: codesandbox-artifacts
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      SANDBOX_JOB_SIGNING_KEY: ${SANDBOX_JOB_SIGNING_KEY:-dev-sandbox-job-signing-key-change-me}
      CONTROL_PLANE_INTERNAL_URL: http://app:5000
      SESSION_COOKIE_NAME: cs_session
      SESSION_TTL_HOURS: "24"
      WORKER_CALLBACK_TOKEN_TTL_SECONDS: "900"
      # Public, browser-facing base URL — used only for user-visible links
      # (email verification, OAuth redirect_uri, org invites, Stripe/eSewa
      # return URLs). Never the internal container hostname: every one of
      # its call sites builds a URL the user's own browser must reach.
      # Container-to-container calls (e.g. the worker's callback) use their
      # own CONTROL_PLANE_URL, not this.
      APP_URL: http://localhost
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_CONTROL_PLANE_USER:-control-plane}
      NATS_PASSWORD: ${NATS_CONTROL_PLANE_PASSWORD:-dev-control-plane-nats-change-me}
      ENVIRONMENT: development
      # Dev only — enables Jinja2 template auto-reload (see app.py). Do NOT set in prod.
      FLASK_DEBUG: "1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:9
    container_name: codesandbox-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codesandbox
      MYSQL_USER: codesandbox
      MYSQL_PASSWORD: codesandbox
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucodesandbox", "-pcodesandbox"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codesandbox-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Sandbox worker ─────────────────────────────────────────────────────────
  # DEVELOPMENT ONLY below: SANDBOX_DOCKER_BACKEND=local_socket + the bind-mounted
  # /var/run/docker.sock give this container root-equivalent control of the
  # host's Docker daemon. Never ship this to production — see
  # docker-compose.prod.yml and docs/runtime-architecture.md for the
  # SANDBOX_DOCKER_BACKEND=remote_tls setup, which the worker refuses to
  # bypass in production (ENVIRONMENT=production) unless you explicitly set
  # ALLOW_UNSAFE_DOCKER_SOCKET=true.
  worker:
    build:
      context: ./worker
    container_name: codesandbox-worker
    environment:
      ENVIRONMENT: development
      WORKER_ID: worker-1
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_URL: http://app:5000
      NATS_URL: nats://nats:4222
      NATS_USER: ${NATS_WORKER_USER:-worker}
      NATS_PASSWORD: ${NATS_WORKER_PASSWORD:-dev-worker-nats-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_ARTIFACT_BUCKET: codesandbox-artifacts
      SANDBOX_JOB_SIGNING_KEY: ${SANDBOX_JOB_SIGNING_KEY:-dev-sandbox-job-signing-key-change-me}
      SANDBOX_ALLOWED_IMAGES: ${SANDBOX_ALLOWED_IMAGES:-docker.io/admin12121/decompile:stable,ubuntu:22.04,busybox:1.36}
      SANDBOX_REQUIRE_IMAGE_ALLOWLIST: ${SANDBOX_REQUIRE_IMAGE_ALLOWLIST:-false}
      SANDBOX_VOLUME_INIT_IMAGE: busybox:1.36
      SANDBOX_DOCKER_BACKEND: local_socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  reconciler:
    build:
      context: .
      dockerfile: Dockerfile.dev
      network: host
    command: ["uv", "run", "python", "-u", "-m", "codesandbox.reconciler"]
    volumes:
      - .:/app
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/codesandbox/.venv
      UV_NO_SYNC: "1"
      DATABASE_URL: mysql://codesandbox:codesandbox@mysql:3306/codesandbox
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      SANDBOX_JOB_SIGNING_KEY: ${SANDBOX_JOB_SIGNING_KEY:-dev-sandbox-job-signing-key-change-me}
      CONTROL_PLANE_INTERNAL_URL: http://app:5000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── NATS messaging ─────────────────────────────────────────────────────────
  nats:
    image: nats:2-alpine
    container_name: codesandbox-nats
    command: ["-js", "-c", "/etc/nats/nats-server.conf"]
    environment:
      NATS_CONTROL_PLANE_USER: ${NATS_CONTROL_PLANE_USER:-control-plane}
      NATS_CONTROL_PLANE_PASSWORD: ${NATS_CONTROL_PLANE_PASSWORD:-dev-control-plane-nats-change-me}
      NATS_WORKER_USER: ${NATS_WORKER_USER:-worker}
      NATS_WORKER_PASSWORD: ${NATS_WORKER_PASSWORD:-dev-worker-nats-change-me}
    volumes:
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    restart: unless-stopped

  # ── MinIO object storage ───────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: codesandbox-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
