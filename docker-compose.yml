services:

  # ── Reverse proxy ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: codesandbox-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # ── Flask application ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      network: host
    container_name: codesandbox-app
    command:
      - /bin/sh
      - -c
      - |
        uv run nexorm makemigrations
        uv run nexorm migrate
        uv run python seed.py
        exec uv run uvicorn codesandbox.asgi:app --host 0.0.0.0 --port 5000 --reload
    volumes:
      - .:/app
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/codesandbox/.venv
      DATABASE_URL: mysql://codesandbox:codesandbox@mysql:3306/codesandbox
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: codesandbox
      SECRET_KEY: dev-secret-change-in-production
      SESSION_COOKIE_NAME: cs_session
      SESSION_TTL_HOURS: "24"
      WORKER_CALLBACK_TOKEN_TTL_SECONDS: "900"
      APP_URL: http://app:5000
      NATS_URL: nats://nats:4222
      # Dev only — enables Jinja2 template auto-reload (see app.py). Do NOT set in prod.
      FLASK_DEBUG: "1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:9
    container_name: codesandbox-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codesandbox
      MYSQL_USER: codesandbox
      MYSQL_PASSWORD: codesandbox
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucodesandbox", "-pcodesandbox"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codesandbox-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Mock sandbox worker ───────────────────────────────────────────────────
  worker:
    build:
      context: ./worker
    container_name: codesandbox-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_URL: http://app:5000
      NATS_URL: nats://nats:4222
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  # ── NATS messaging ─────────────────────────────────────────────────────────
  nats:
    image: nats:2-alpine
    container_name: codesandbox-nats
    command: ["-js"]
    restart: unless-stopped

  # ── MinIO object storage ───────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: codesandbox-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./storage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
