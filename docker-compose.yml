name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:?Set LOG_MAX_SIZE in .env}
    max-file: ${LOG_MAX_FILES:?Set LOG_MAX_FILES in .env}

x-python-runtime-env: &python-runtime-env
  UV_PROJECT_ENVIRONMENT: ${UV_PROJECT_ENVIRONMENT:?Set UV_PROJECT_ENVIRONMENT in .env}
  UV_NO_SYNC: ${UV_NO_SYNC:?Set UV_NO_SYNC in .env}
  PYTHONPATH: ${PYTHONPATH:?Set PYTHONPATH in .env}
  PYTHONDONTWRITEBYTECODE: ${PYTHONDONTWRITEBYTECODE:?Set PYTHONDONTWRITEBYTECODE in .env}
  PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:?Set PYTHONUNBUFFERED in .env}

x-app-environment: &app-environment
  <<: *python-runtime-env
  ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env}
  WINDOW: ${WINDOW:-false}
  FLASK_DEBUG: ${FLASK_DEBUG:?Set FLASK_DEBUG in .env}
  USE_BUILT_TAILWIND: ${USE_BUILT_TAILWIND:-auto}
  TAILWIND_CSS_PATH: ${TAILWIND_CSS_PATH:-/app/generated-public/app.css}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
  APP_URL: ${APP_URL:?Set APP_URL in .env}
  CONTROL_PLANE_INTERNAL_URL: ${CONTROL_PLANE_INTERNAL_URL:?Set CONTROL_PLANE_INTERNAL_URL in .env}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:?Set SESSION_COOKIE_NAME in .env}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:?Set SESSION_TTL_HOURS in .env}
  COOKIE_SECURE: ${COOKIE_SECURE:?Set COOKIE_SECURE in .env}
  WORKER_CALLBACK_TOKEN_TTL_SECONDS: ${WORKER_CALLBACK_TOKEN_TTL_SECONDS:?Set WORKER_CALLBACK_TOKEN_TTL_SECONDS in .env}
  SANDBOX_JOB_SIGNING_KEY: ${SANDBOX_JOB_SIGNING_KEY:?Set SANDBOX_JOB_SIGNING_KEY in .env}
  SANDBOX_PROVISIONING_STALE_SECONDS: ${SANDBOX_PROVISIONING_STALE_SECONDS:?Set SANDBOX_PROVISIONING_STALE_SECONDS in .env}
  SANDBOX_HEARTBEAT_STALE_SECONDS: ${SANDBOX_HEARTBEAT_STALE_SECONDS:?Set SANDBOX_HEARTBEAT_STALE_SECONDS in .env}
  SANDBOX_STOPPING_STALE_SECONDS: ${SANDBOX_STOPPING_STALE_SECONDS:?Set SANDBOX_STOPPING_STALE_SECONDS in .env}
  SANDBOX_CLEANUP_STALE_SECONDS: ${SANDBOX_CLEANUP_STALE_SECONDS:?Set SANDBOX_CLEANUP_STALE_SECONDS in .env}
  SANDBOX_RECONCILE_INTERVAL_SECONDS: ${SANDBOX_RECONCILE_INTERVAL_SECONDS:?Set SANDBOX_RECONCILE_INTERVAL_SECONDS in .env}
  WORKER_OFFLINE_TIMEOUT_SECONDS: ${WORKER_OFFLINE_TIMEOUT_SECONDS:?Set WORKER_OFFLINE_TIMEOUT_SECONDS in .env}
  SANDBOX_ARTIFACT_RETENTION_DAYS: ${SANDBOX_ARTIFACT_RETENTION_DAYS:?Set SANDBOX_ARTIFACT_RETENTION_DAYS in .env}
  SANDBOX_MAX_UPLOAD_BYTES: ${SANDBOX_MAX_UPLOAD_BYTES:?Set SANDBOX_MAX_UPLOAD_BYTES in .env}
  BILLING_DEV_TOPUP_ENABLED: ${BILLING_DEV_TOPUP_ENABLED:?Set BILLING_DEV_TOPUP_ENABLED in .env}
  S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in .env}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
  S3_ARTIFACT_BUCKET: ${S3_ARTIFACT_BUCKET:?Set S3_ARTIFACT_BUCKET in .env}
  NATS_URL: ${NATS_URL:?Set NATS_URL in .env}
  NATS_USER: ${NATS_CONTROL_PLANE_USER:?Set NATS_CONTROL_PLANE_USER in .env}
  NATS_PASSWORD: ${NATS_CONTROL_PLANE_PASSWORD:?Set NATS_CONTROL_PLANE_PASSWORD in .env}
  RESEND_APIKEY: ${RESEND_APIKEY:-}
  FROM_EMAIL: ${FROM_EMAIL:?Set FROM_EMAIL in .env}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  ESEWA_PRODUCT_CODE: ${ESEWA_PRODUCT_CODE:?Set ESEWA_PRODUCT_CODE in .env}
  ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY:?Set ESEWA_SECRET_KEY in .env}
  ESEWA_FORM_URL: ${ESEWA_FORM_URL:?Set ESEWA_FORM_URL in .env}
  ESEWA_STATUS_URL: ${ESEWA_STATUS_URL:?Set ESEWA_STATUS_URL in .env}
  NRB_FOREX_URL: ${NRB_FOREX_URL:?Set NRB_FOREX_URL in .env}
  NRB_FOREX_CACHE_TTL_SECONDS: ${NRB_FOREX_CACHE_TTL_SECONDS:?Set NRB_FOREX_CACHE_TTL_SECONDS in .env}
  FINANCE_COST_PER_VCPU_HOUR: ${FINANCE_COST_PER_VCPU_HOUR:?Set FINANCE_COST_PER_VCPU_HOUR in .env}
  FINANCE_COST_PER_RAM_GB_HOUR: ${FINANCE_COST_PER_RAM_GB_HOUR:?Set FINANCE_COST_PER_RAM_GB_HOUR in .env}
  FINANCE_COST_PER_DISK_GB_HOUR: ${FINANCE_COST_PER_DISK_GB_HOUR:?Set FINANCE_COST_PER_DISK_GB_HOUR in .env}

x-app-build: &app-build
  image: ${COMPOSE_PROJECT_NAME}-app:local
  build:
    context: .
    dockerfile: Dockerfile.dev

services:
  nginx:
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE in .env}
    ports:
      - "127.0.0.1:${HTTP_PORT:?Set HTTP_PORT in .env}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  bootstrap:
    <<: *app-build
    command:
      - /bin/sh
      - -ec
      - |
        is_true() {
          case "$${1:-}" in
            1|true|TRUE|True|yes|YES|Yes|on|ON|On) return 0 ;;
            *) return 1 ;;
          esac
        }

        if ! is_true "$${AUTO:-true}"; then
          echo "[bootstrap] AUTO=false: skipping migration and seed"
          exit 0
        fi

        cd /app
        echo "[bootstrap] preparing writable migrations"
        find /app/migrations -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        cp -R /app/.baked/migrations/. /app/migrations/

        echo "[bootstrap] running pending migrations"
        /opt/codesandbox/.venv/bin/nexorm migrate

        : "$${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL when AUTO=true}"
        : "$${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD when AUTO=true}"
        : "$${SEED_ADMIN_NAME:?Set SEED_ADMIN_NAME when AUTO=true}"

        echo "[bootstrap] running seed"
        /opt/codesandbox/.venv/bin/python -u seed.py

        echo "[bootstrap] completed successfully"
    environment:
      <<: *app-environment
      AUTO: ${AUTO:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/migrations:size=64m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *default-logging

  app:
    <<: *app-build
    command:
      - /bin/sh
      - -ec
      - |
        is_true() {
          case "$${1:-}" in
            1|true|TRUE|True|yes|YES|Yes|on|ON|On) return 0 ;;
            *) return 1 ;;
          esac
        }

        set -- /opt/codesandbox/.venv/bin/uvicorn codesandbox.asgi:app \
          --host 0.0.0.0 \
          --port 5000 \
          --proxy-headers \
          --forwarded-allow-ips=*

        if is_true "$${WINDOW:-false}"; then
          echo "[app] WINDOW=true: disabling uvicorn reload"
        else
          set -- "$$@" --reload --reload-dir /app/src --reload-dir /app/packages
        fi

        exec "$$@"
    environment: *app-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /opt/codesandbox/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging

  migrate:
    <<: *app-build
    profiles: ["tools"]
    command:
      - /bin/sh
      - -ec
      - |
        cd /app
        find /app/migrations -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        cp -R /app/.baked/migrations/. /app/migrations/
        exec /opt/codesandbox/.venv/bin/nexorm migrate
    environment:
      <<: *python-runtime-env
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/migrations:size=64m,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *default-logging

  seed:
    <<: *app-build
    profiles: ["tools"]
    command: ["/opt/codesandbox/.venv/bin/python", "-u", "seed.py"]
    environment:
      <<: *app-environment
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:?Set SEED_ADMIN_NAME in .env}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *default-logging

  reconciler:
    <<: *app-build
    command: ["/opt/codesandbox/.venv/bin/python", "-u", "-m", "codesandbox.reconciler"]
    environment:
      <<: *python-runtime-env
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SANDBOX_JOB_SIGNING_KEY: ${SANDBOX_JOB_SIGNING_KEY:?Set SANDBOX_JOB_SIGNING_KEY in .env}
      CONTROL_PLANE_INTERNAL_URL: ${CONTROL_PLANE_INTERNAL_URL:?Set CONTROL_PLANE_INTERNAL_URL in .env}
      SANDBOX_PROVISIONING_STALE_SECONDS: ${SANDBOX_PROVISIONING_STALE_SECONDS:?Set SANDBOX_PROVISIONING_STALE_SECONDS in .env}
      SANDBOX_HEARTBEAT_STALE_SECONDS: ${SANDBOX_HEARTBEAT_STALE_SECONDS:?Set SANDBOX_HEARTBEAT_STALE_SECONDS in .env}
      SANDBOX_STOPPING_STALE_SECONDS: ${SANDBOX_STOPPING_STALE_SECONDS:?Set SANDBOX_STOPPING_STALE_SECONDS in .env}
      SANDBOX_CLEANUP_STALE_SECONDS: ${SANDBOX_CLEANUP_STALE_SECONDS:?Set SANDBOX_CLEANUP_STALE_SECONDS in .env}
      SANDBOX_RECONCILE_INTERVAL_SECONDS: ${SANDBOX_RECONCILE_INTERVAL_SECONDS:?Set SANDBOX_RECONCILE_INTERVAL_SECONDS in .env}
      WORKER_OFFLINE_TIMEOUT_SECONDS: ${WORKER_OFFLINE_TIMEOUT_SECONDS:?Set WORKER_OFFLINE_TIMEOUT_SECONDS in .env}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  docker-engine:
    image: ${COMPOSE_PROJECT_NAME}-docker-engine-lxcfs:local
    pull_policy: build
    build:
      context: ./docker/dind-lxcfs
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${DOCKER_DIND_IMAGE:?Set DOCKER_DIND_IMAGE in .env}
    hostname: docker-engine
    privileged: true
    mem_limit: ${SANDBOX_DIND_MEMORY_LIMIT:-26g}
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_DRIVER: overlay2
      LXCFS_ROOT: /var/lib/lxcfs
      SANDBOX_LXCFS_ENABLED: ${SANDBOX_LXCFS_ENABLED:-auto}
      SANDBOX_LXCFS_STATE_FILE: /certs/client/codesandbox-lxcfs-enabled
    volumes:
      - docker_engine_data:/var/lib/docker
      - docker_engine_certs:/certs
      - docker_engine_client_certs:/certs/client
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          docker info >/dev/null 2>&1 &&
          lxcfs_state="$$(cat "$${SANDBOX_LXCFS_STATE_FILE:-/certs/client/codesandbox-lxcfs-enabled}" 2>/dev/null || echo false)" &&
          case "$${SANDBOX_LXCFS_ENABLED:-auto}:$${lxcfs_state}" in
            true:*|TRUE:*|True:*|1:*|yes:*|YES:*|Yes:*|on:*|ON:*|On:*|auto:true|AUTO:true|Auto:true)
              grep -q '^MemTotal:' /var/lib/lxcfs/proc/meminfo &&
              test -s /var/lib/lxcfs/proc/cpuinfo &&
              test -r /var/lib/lxcfs/sys/devices/system/cpu/online
              ;;
            *)
              true
              ;;
          esac
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *default-logging

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env}
      LOG_LEVEL: ${LOG_LEVEL:?Set LOG_LEVEL in .env}
      WORKER_ID: ${WORKER_ID:?Set WORKER_ID in .env}
      RUNTIME_NODE_ID: ${RUNTIME_NODE_ID:?Set RUNTIME_NODE_ID in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:?Set CONTROL_PLANE_URL in .env}
      NATS_URL: ${NATS_URL:?Set NATS_URL in .env}
      NATS_USER: ${NATS_WORKER_USER:?Set NATS_WORKER_USER in .env}
      NATS_PASSWORD: ${NATS_WORKER_PASSWORD:?Set NATS_WORKER_PASSWORD in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_ARTIFACT_BUCKET: ${S3_ARTIFACT_BUCKET:?Set S3_ARTIFACT_BUCKET in .env}
      S3_CONNECT_TIMEOUT_SECONDS: ${S3_CONNECT_TIMEOUT_SECONDS:-5}
      S3_READ_TIMEOUT_SECONDS: ${S3_READ_TIMEOUT_SECONDS:-30}
      S3_MAX_ATTEMPTS: ${S3_MAX_ATTEMPTS:-3}
      SANDBOX_JOB_SIGNING_KEY: ${SANDBOX_JOB_SIGNING_KEY:?Set SANDBOX_JOB_SIGNING_KEY in .env}
      SANDBOX_JOB_MAX_AGE_SECONDS: ${SANDBOX_JOB_MAX_AGE_SECONDS:?Set SANDBOX_JOB_MAX_AGE_SECONDS in .env}
      SANDBOX_VOLUME_INIT_IMAGE: ${SANDBOX_VOLUME_INIT_IMAGE:?Set SANDBOX_VOLUME_INIT_IMAGE in .env}
      SANDBOX_RUNTIME_EGRESS_TEST_URL: ${SANDBOX_RUNTIME_EGRESS_TEST_URL:-http://example.com/}
      SANDBOX_LXCFS_ENABLED: ${SANDBOX_LXCFS_ENABLED:-auto}
      SANDBOX_LXCFS_ROOT: /var/lib/lxcfs
      SANDBOX_LXCFS_STATE_FILE: /certs/client/codesandbox-lxcfs-enabled
      SANDBOX_REGISTRY_SERVER: ${SANDBOX_REGISTRY_SERVER:-}
      SANDBOX_REGISTRY_USERNAME: ${SANDBOX_REGISTRY_USERNAME:-}
      SANDBOX_REGISTRY_PASSWORD: ${SANDBOX_REGISTRY_PASSWORD:-}
      SANDBOX_REGISTRY_EMAIL: ${SANDBOX_REGISTRY_EMAIL:-}
      SANDBOX_DEFAULT_USER: ${SANDBOX_DEFAULT_USER:?Set SANDBOX_DEFAULT_USER in .env}
      SANDBOX_MAX_ARTIFACT_BYTES: ${SANDBOX_MAX_ARTIFACT_BYTES:?Set SANDBOX_MAX_ARTIFACT_BYTES in .env}
      SANDBOX_WORKER_TOTAL_VCPU: ${SANDBOX_WORKER_TOTAL_VCPU:?Set SANDBOX_WORKER_TOTAL_VCPU in .env}
      SANDBOX_WORKER_TOTAL_RAM_GB: ${SANDBOX_WORKER_TOTAL_RAM_GB:?Set SANDBOX_WORKER_TOTAL_RAM_GB in .env}
      SANDBOX_DIND_MEMORY_LIMIT_GB: ${SANDBOX_DIND_MEMORY_LIMIT_GB:-26}
      SANDBOX_WORKER_TOTAL_DISK_GB: ${SANDBOX_WORKER_TOTAL_DISK_GB:?Set SANDBOX_WORKER_TOTAL_DISK_GB in .env}
      SANDBOX_WORKER_HEARTBEAT_SECONDS: ${SANDBOX_WORKER_HEARTBEAT_SECONDS:?Set SANDBOX_WORKER_HEARTBEAT_SECONDS in .env}
      SANDBOX_DOCKER_BACKEND: remote_tls
      ALLOW_UNSAFE_DOCKER_SOCKET: "false"
      DOCKER_HOST: tcp://docker-engine:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - docker_engine_client_certs:/certs/client:ro
    depends_on:
      docker-engine:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      app:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /tmp/codesandbox-worker-ready &&
          /worker/.venv/bin/python -c
          'from runtime.docker_client import DockerClientFactory; c=DockerClientFactory.create(); assert c.ping(); c.close()'
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  mysql:
    image: ${MYSQL_IMAGE:?Set MYSQL_IMAGE in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE in .env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging

  nats:
    image: ${NATS_IMAGE:?Set NATS_IMAGE in .env}
    command:
      - -js
      - -sd
      - /data
      - -m
      - "8222"
      - -c
      - /etc/nats/nats-server.conf
    environment:
      NATS_CONTROL_PLANE_USER: ${NATS_CONTROL_PLANE_USER:?Set NATS_CONTROL_PLANE_USER in .env}
      NATS_CONTROL_PLANE_PASSWORD: ${NATS_CONTROL_PLANE_PASSWORD:?Set NATS_CONTROL_PLANE_PASSWORD in .env}
      NATS_WORKER_USER: ${NATS_WORKER_USER:?Set NATS_WORKER_USER in .env}
      NATS_WORKER_PASSWORD: ${NATS_WORKER_PASSWORD:?Set NATS_WORKER_PASSWORD in .env}
    volumes:
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE in .env}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:?Set MINIO_CONSOLE_PORT in .env}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:?Set MINIO_BROWSER_REDIRECT_URL in .env}
    volumes:
      - ${MINIO_DATA_DIR:?Set MINIO_DATA_DIR in .env}:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  mysql_data:
  redis_data:
  nats_data:
  docker_engine_data:
  docker_engine_certs:
  docker_engine_client_certs:
