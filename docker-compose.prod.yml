# Production override — starting point, not a turnkey deployment.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# This removes the bind-mounted Docker socket from the worker service and
# points it at a dedicated Docker host over mutual TLS instead, so the
# worker container never has root-equivalent access to the machine it runs
# on. See docs/runtime-architecture.md for the full production worker
# architecture and how to provision the Docker host + client certs.
services:
  worker:
    environment:
      ENVIRONMENT: production
      SANDBOX_DOCKER_BACKEND: remote_tls
      DOCKER_HOST: tcp://worker-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /run/secrets/docker-client-certs
    # Compose merges list-valued keys (like `volumes`) across -f files by
    # concatenation, not replacement — `!reset` (Compose Specification merge
    # tag, requires Compose v2.24+) is what actually drops the base file's
    # docker.sock bind mount instead of appending to it. On an older Compose
    # version, delete the base `worker.volumes` bind mount by hand instead.
    volumes: !reset []
    secrets:
      - docker-client-certs

secrets:
  docker-client-certs:
    external: true
